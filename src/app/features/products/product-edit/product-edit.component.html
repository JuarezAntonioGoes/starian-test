@if (getService.loading()) {
  <app-loading-spinner message="Carregando produto..." />
} @else if (getService.error()) {
  <div class="state-container">
    <p class="error-message">{{ getService.error() }}</p>
    <button mat-stroked-button (click)="goBack()">Voltar</button>
  </div>
} @else if (getService.product()) {
  <app-product-form [initialData]="getService.product()!" />
}
