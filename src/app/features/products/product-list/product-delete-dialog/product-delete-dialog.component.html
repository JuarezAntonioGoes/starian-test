<h2 mat-dialog-title>Excluir Produto</h2>

<mat-dialog-content>
  <p>
    Tem certeza que deseja excluir <strong>{{ data.productName }}</strong
    >?
  </p>
  <p>Esta ação não pode ser desfeita.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="warn" (click)="confirm()">Excluir</button>
</mat-dialog-actions>
