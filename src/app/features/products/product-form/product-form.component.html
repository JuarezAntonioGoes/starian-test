<app-page-header [title]="isEditMode ? 'Editar Produto' : 'Novo Produto'" backPath="/products" />

<div class="container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
    <app-text-field formControlName="title" label="Título" placeholder="Nome do produto" />
    <app-text-field formControlName="price" label="Preço" placeholder="0.00" type="number" />
    <app-text-field formControlName="category" label="Categoria" placeholder="Ex: electronics" />
    <app-text-field formControlName="image" label="URL da Imagem" placeholder="https://..." />
    <app-text-field
      formControlName="description"
      label="Descrição"
      placeholder="Descreva o produto"
      type="textarea"
    />

    <div class="actions">
      <button mat-stroked-button type="button" (click)="onCancel()">Cancelar</button>
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="form.invalid || formService.saving()"
      >
        @if (formService.saving()) {
          <mat-spinner diameter="20" />
        } @else {
          Salvar
        }
      </button>
    </div>
  </form>
</div>
